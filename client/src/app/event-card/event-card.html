<article class="card" [class.favourite]="favourite()">
  <p class="date">
    {{ event().date | date: 'EEE d MMM, HH:mm' }}
    @if (favourite()) {
      <span class="star" aria-label="Favourite">★</span>
    }
  </p>
  <h2>{{ event().title }}</h2>
  <p class="meta">{{ event().location }} · {{ event().capacity }} places</p>
  @if (event().description) {
    <p>{{ event().description }}</p>
  }
  <button type="button" (click)="favouriteToggle.emit(event())">
    {{ favourite() ? '★ Remove from favourites' : '☆ Add to favourites' }}
  </button>
</article>
